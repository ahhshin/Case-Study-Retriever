 ranked.sort((a,b)=>b.score-a.score||a.case_id.localeCompare(b.case_id));return {results:ranked.slice(0,3),mode:'metadata'};
}
function display(data){$('results').replaceChildren();$('status').className='';$('status').textContent=data.results.length?`${data.results.length} matching ${data.results.length===1?'case':'cases'}`:'No matching case found. Try another description.';
 for(const r of data.results){const card=el('article');card.append(el('h2',r.title),el('p',r.summary),el('p',r.reasons.join(' · '),'muted'));
 const tags=el('div');for(const dim of ['industry','ai_use_case','brand_context'])for(const t of r.tags[dim]||[])tags.append(el('span',t.replaceAll('_',' '),'tag'));card.append(tags);
 const evidence=el('details');evidence.append(el('summary','Supporting evidence'));
 for(const ev of r.evidence){evidence.append(el('blockquote',ev.quote),link(`Source · page ${ev.page}`,ev.source_url));}card.append(evidence);
 if(r.proof_points.length){const d=el('details');d.append(el('summary','Reported outcomes'));const ul=el('ul');for(const p of r.proof_points){const li=el('li',`${p.metric}: ${p.text} Scope: ${p.scope}${p.qualification?' '+p.qualification:''}`);ul.append(li);}d.append(ul);card.append(d);}
 if(r.limitations.length){const d=el('details');d.append(el('summary','Case limitations'));const ul=el('ul');r.limitations.forEach(x=>ul.append(el('li',x)));d.append(ul);card.append(d);}
 card.append(link('Open original source',r.source_url),el('p',`Review status: ${r.review_status}. Outcomes are publisher-reported.`,'muted'));$('results').append(card);
 }
 $('mode').textContent=data.mode==='model'?'Model search · evidence IDs validated; check relevance against the source.':'Metadata search · no model called. The case records are drafts.';
}
async function search(){const query=$('query').value.trim();if(!query)return;$('submit').disabled=true;$('status').textContent='Searching…';
 try{let data;if(EMBEDDED)data=baseline(query);else{const r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query})});data=await r.json();if(!r.ok)throw new Error(data.error||'Search failed');}display(data);}
 catch(e){$('results').replaceChildren();$('status').textContent=e.message;$('status').className='error';}finally{$('submit').disabled=false;}}
$('search').addEventListener('submit',e=>{e.preventDefault();search();});document.querySelectorAll('[data-query]').forEach(b=>b.addEventListener('click',()=>{$('query').value=b.dataset.query;search();}));
if(EMBEDDED)$('mode').textContent='Metadata search · no model called. Works offline; the case records are drafts.';
else fetch('/api/status').then(r=>r.json()).then(d=>{$('mode').textContent=d.mode==='model'?'Model search ready.':'Metadata search ready · no model called.';}).catch(()=>{$('mode').textContent='Start case-serve to use this interface, or open demo.html for offline testing.';});
</script></body></html>
